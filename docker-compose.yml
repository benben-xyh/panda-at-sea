services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://blog:blogpass@postgres:5432/pandasea
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      CORS_ORIGINS: "http://localhost"          # 生产改为前端域名
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pandasea
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blogpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d pandasea"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
